# version: '4.0'

services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_challenge
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - app-network
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=test_challenge
      - DB_USERNAME=test_challenge
      - DB_PASSWORD=Dynamo!@#123

  mysql:
    image: mysql:8.0
    # container_name: mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: test_challenge
      MYSQL_USER: test_challenge
      MYSQL_PASSWORD: Dynamo!@#123
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    # container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
 
volumes:
  db_data: